name: Living Memory Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'work/living-memory-local-rag', 'work/living-memory-v1.1-auto-memory', 'work/living-memory-v1.2-multimodel', 'work/living-memory-v1.3-google-integration', 'work/living-memory-v1.3.1-security']
    paths:
      - 'samples/litert/flutter/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'samples/litert/flutter/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: living-memory-${{ github.sha }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: samples/litert/flutter
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: SDK versions
        run: |
          flutter --version
          java -version
          python --version
          python -m unittest discover -s tool -p test_apk_signer.py -v
          python -m unittest discover -s tool -p test_native_dependency_security.py -v
      - name: Prepare pinned plugin and bundled public models
        run: |
          bash tool/flutter_litert/vendor.sh
          bash tool/fetch_models.sh
          bash tool/fetch_models.sh --check
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Android privacy source gates
        run: |
          mkdir -p build/evidence
          set -o pipefail
          python -m unittest discover -s tool -p test_android_security.py -v 2>&1 | tee build/evidence/android-security-source.log
      - name: V1.3.1 security contracts
        run: |
          failed=0
          flutter test test/living_memory/privacy_logging_test.dart --reporter expanded || failed=1
          flutter test test/living_memory/security_storage_test.dart --reporter expanded || failed=1
          flutter test test/living_memory/model_transport_security_test.dart --reporter expanded || failed=1
          exit "$failed"
      - name: Auto-memory focused contracts
        run: |
          mkdir -p build/evidence
          set -o pipefail
          flutter test test/living_memory test/data/services/llm/llm_service_test.dart --reporter expanded 2>&1 | tee build/evidence/auto-memory-test.log
      - name: Check auto-memory source formatting
        if: ${{ !cancelled() }}
        run: |
          dart format lib/living_memory test/living_memory lib/app.dart lib/data/repositories/chat_model_repository.dart test/data/repositories/chat_model_repository_test.dart lib/data/services/llm/llm_service.dart lib/data/repositories/model_repository.dart lib/domain/use_cases/chat_model_switcher.dart test/data/services/llm/llm_service_test.dart test/domain/use_cases/chat_model_switcher_test.dart
          git diff -- lib/living_memory test/living_memory lib/app.dart lib/data/repositories/chat_model_repository.dart test/data/repositories/chat_model_repository_test.dart lib/data/services/llm/llm_service.dart lib/data/repositories/model_repository.dart lib/domain/use_cases/chat_model_switcher.dart test/data/services/llm/llm_service_test.dart test/domain/use_cases/chat_model_switcher_test.dart > build/evidence/dart-format.patch
          git diff --exit-code -- lib/living_memory test/living_memory lib/app.dart lib/data/repositories/chat_model_repository.dart test/data/repositories/chat_model_repository_test.dart lib/data/services/llm/llm_service.dart lib/data/repositories/model_repository.dart lib/domain/use_cases/chat_model_switcher.dart test/data/services/llm/llm_service_test.dart test/domain/use_cases/chat_model_switcher_test.dart
      - name: Analyze
        if: ${{ !cancelled() }}
        run: flutter analyze
      - name: Unit and widget regression suite
        run: |
          mkdir -p build/evidence
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee build/evidence/flutter-test.log
      - name: Build installable arm64 APK
        run: |
          flutter build apk --release --target-platform android-arm64
          mkdir -p build/evidence
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/evidence/APK-SHA256.txt
          (cd android && ./gradlew :app:dependencies --configuration releaseRuntimeClasspath) > build/evidence/android-dependencies.txt
          python tool/audit_native_dependencies.py build/evidence/android-dependencies.txt | tee build/evidence/native-dependency-security.json
          merged=$(find build/app/intermediates/merged_manifests -path '*release*' -name AndroidManifest.xml | head -1)
          test -n "$merged"
          cp "$merged" build/evidence/merged-AndroidManifest.xml
          ANDROID_MERGED_MANIFEST="$merged" python -m unittest discover -s tool -p test_android_security.py -v 2>&1 | tee build/evidence/android-security-merged.log
      - name: Verify built APK signature and contents
        run: |
          tools_version=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools_version/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee build/evidence/apk-signature.txt
          "$tools_version/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > build/evidence/apk-badging.txt
          python3 - <<'PYAPK'
          import hashlib, json, os, re, zipfile, sys
          sys.path.insert(0, "tool")
          from apk_signer import certificate_sha256
          from pathlib import Path
          apk=Path('build/app/outputs/flutter-apk/app-release.apk')
          with zipfile.ZipFile(apk) as z:
              abis=sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')})
              assert abis==['arm64-v8a'], abis
              size=z.getinfo('assets/flutter_assets/assets/models/embeddinggemma-2-740m.litertlm').file_size
              assert size==484622336, size
              lock=next(line.split() for line in Path('tool/models.lock').read_text().splitlines() if line.startswith('hf embeddinggemma-2-740m.litertlm '))
              with z.open('assets/flutter_assets/assets/models/embeddinggemma-2-740m.litertlm') as model:
                  model_sha=hashlib.file_digest(model, 'sha256').hexdigest()
              assert model_sha==lock[3], (model_sha, lock[3])
          signature=Path('build/evidence/apk-signature.txt').read_text()
          cert=certificate_sha256(signature)
          previous='cc90f8b4d170d0410025bab5ba3af71567fd6ecbd420c411230043c7389dc487'
          metadata={'commit_sha':os.environ['GITHUB_SHA'],'embedding_model_sha256':model_sha,'hardware_tested':False,'apk_bytes':apk.stat().st_size,'abis':abis,'embedding_model_bytes':size,
                    'certificate_sha256':cert,'v1_certificate_matches':cert==previous}
          Path('build/evidence/apk-metadata.json').write_text(json.dumps(metadata,indent=2))
          print(json.dumps(metadata,indent=2))
          PYAPK
      - name: Include validation report
        if: always()
        run: |
          mkdir -p build/evidence
          cp ../../../docs/living-memory/v1.3/AUDIT.md build/evidence/validation-report.md
          cp ../../../docs/living-memory/v1.3/INSTALL_S22.md build/evidence/S22-protocol.md
          python3 - <<'PYREPORT'
          import os
          from pathlib import Path
          with Path('build/evidence/validation-report.md').open('a') as report:
              report.write('\n\n## Exécution associée\nCommit : ' + os.environ['GITHUB_SHA'] + '\nRun : https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\nVérifier le statut final et les journaux. Tests matériels : non exécutés.\n')
              for label, name in [('Tests cibles', 'auto-memory-test.log'), ('Suite complete', 'flutter-test.log')]:
                  log = Path('build/evidence') / name
                  lines = log.read_text(errors='replace').splitlines() if log.exists() else []
                  summaries = [line for line in lines if 'All tests passed!' in line or 'Some tests failed.' in line]
                  report.write('\n' + label + ' : ' + (summaries[-1] if summaries else 'non termine / non execute, consulter le journal') + '\n')
              metadata = Path('build/evidence/apk-metadata.json')
              if metadata.exists():
                  report.write('\nMetadonnees APK controlees :\n' + metadata.read_text() + '\n')
          PYREPORT
      - name: Upload APK and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: living-memory-android-${{ github.sha }}
          path: |
            samples/litert/flutter/build/app/outputs/flutter-apk/app-release.apk
            samples/litert/flutter/build/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload light validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: living-memory-v1.3-validation-${{ github.sha }}
          path: samples/litert/flutter/build/evidence/
          if-no-files-found: warn
          retention-days: 30
