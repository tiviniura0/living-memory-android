# Task 1 lifecycle regression: bound optional diagnostics and report every native command outcome.
name: Living World Godot Task 1
on:
  workflow_dispatch:
  push:
    branches: ['work/living-world-godot2d']
    paths: ['.github/workflows/world-godot.yml']
permissions:
  contents: read
concurrency:
  group: world-godot-task1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  task1:
    if: github.ref == 'refs/heads/work/living-world-godot2d'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Fixed official Godot CLI and PCK
        run: |
          set -euo pipefail
          mkdir -p evidence/godot-task1
          downloads="$RUNNER_TEMP/godot-task1"
          mkdir -p "$downloads"
          archive="$downloads/godot.zip"
          curl --fail --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 600 https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o "$archive"
          printf '%s  %s\n' 02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd "$archive" | sha256sum --check
          unzip -q "$archive" -d "$downloads/cli"
          export GODOT_BIN="$downloads/cli/Godot_v4.5.1-stable_linux.x86_64"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          bash scripts/build_world_godot.sh 2>&1 | tee evidence/godot-task1/pack-build.log
      - name: Record source and bootstrap non-destructive shell
        run: |
          set -euo pipefail
          mkdir -p evidence/godot-task1
          git rev-parse HEAD > evidence/godot-task1/source-sha.txt
          bash -n scripts/test_world_godot_native.sh
          python3 -m py_compile scripts/verify_world_godot_capture.py
          python3 -m unittest discover -s tests -v 2>&1 | tee evidence/godot-task1/python.log
          bash scripts/prepare_world_android.sh
          cd apps/world_observer
          flutter pub get --enforce-lockfile
          flutter test --reporter expanded 2>&1 | tee ../../evidence/godot-task1/observer-tests.log
          flutter analyze
      - name: Flutter channel and hybrid surface tests
        run: |
          set -euo pipefail
          cd packages/living_world_godot
          flutter pub get
          flutter test --reporter expanded 2>&1 | tee ../../evidence/godot-task1/channel-tests.log
          flutter analyze 2>&1 | tee ../../evidence/godot-task1/plugin-analysis.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-godot-channel-evidence-${{ github.sha }}
          path: evidence/godot-task1/channel-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Build official native host for x86_64 emulator
        id: native_build
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd apps/world_observer
          ORG_GRADLE_PROJECT_godotTestAbi=x86_64 flutter build apk --debug --target-platform android-x64
          cd android
          ./gradlew :app:assembleDebugAndroidTest -PgodotTestAbi=x86_64
      - name: Enable KVM
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native host and Flutter bridge including stream cancellation
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          emulator-build: '16740729' # 37.2.13, observed in the previous native runs.
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/test_world_godot_native.sh
      - name: Build and inspect ARM64 work actually present
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd apps/world_observer
          flutter build apk --debug --target-platform android-arm64 -t lib/godot_host_smoke.dart
          cd ../..
          apk=apps/world_observer/build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p evidence/godot-delivery
          python3 scripts/inspect_world_godot_apk.py "$apk" evidence/godot-task1/arm64-apk.json
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs "$apk" > evidence/godot-task1/apk-signature.txt
          "$tools/aapt" dump badging "$apk" > evidence/godot-task1/apk-badging.txt
          cp "$apk" evidence/godot-delivery/world-godot-task1-smoke-arm64.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-godot-task1-arm64-${{ github.sha }}
          path: evidence/godot-delivery/world-godot-task1-smoke-arm64.apk
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-godot-task1-evidence-${{ github.sha }}
          path: |
            evidence/godot-task1/
            apps/world_observer/build/app/reports/androidTests/
            apps/world_observer/build/app/outputs/androidTest-results/
            apps/world_observer/android/
          if-no-files-found: error
          retention-days: 14
  regressions:
    if: github.ref == 'refs/heads/work/living-world-godot2d'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: World portable suites and extracted module analysis
        run: |
          set -euo pipefail
          evidence="$PWD/evidence/godot-regressions"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          failed=0
          for package in world_contracts world_core agent_runtime world_persistence; do
            (cd packages/$package && dart pub get --enforce-lockfile && dart analyze && dart test --reporter expanded) 2>&1 | tee "$evidence/$package.log" || failed=1
          done
          for package in living_memory_core living_memory_extensions living_world_memory; do
            (cd packages/$package && dart pub get && dart analyze) 2>&1 | tee "$evidence/$package.log" || failed=1
          done
          (cd tools/world_headless && dart pub get --enforce-lockfile && dart analyze && dart test --reporter expanded && dart run bin/world_headless.dart --fixture ../../fixtures/world/l1_world.json --ticks 10000 --out "$evidence/headless.json") 2>&1 | tee "$evidence/headless.log" || failed=1
          exit "$failed"
      - name: Existing Living Memory full Flutter suite
        if: ${{ !cancelled() }}
        working-directory: samples/litert/flutter
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence/godot-regressions"
          bash tool/flutter_litert/vendor.sh
          bash tool/fetch_models.sh
          flutter pub get
          flutter test --reporter expanded 2>&1 | tee "$evidence/memory-tests.log"
          flutter analyze 2>&1 | tee "$evidence/memory-analysis.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-godot-task1-regressions-${{ github.sha }}
          path: evidence/godot-regressions/
          if-no-files-found: error
          retention-days: 14
