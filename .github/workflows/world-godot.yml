name: Living World Godot preparation
on:
  workflow_dispatch:
  push:
    branches: ['work/living-world-godot2d']
    paths: ['.github/workflows/world-godot.yml']
permissions:
  contents: read
concurrency:
  group: world-godot-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/work/living-world-godot2d'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: '4.5.1'
      GODOT_MAVEN_VERSION: '4.5.1.stable'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record source and scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/godot-preparation
          git rev-parse HEAD > evidence/godot-preparation/source-sha.txt
          printf '%s\n' 'Prerequisites only. No Godot host, lifecycle, security clearance or phone validation is established by this job.' > evidence/godot-preparation/SCOPE.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Check Flutter Java and Android tools
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence/godot-preparation"
          flutter --version --machine | tee "$evidence/flutter-version.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("evidence/godot-preparation/flutter-version.json").read_text())["frameworkVersion"] == "3.47.3"
          PY
          java -version 2>&1 | tee "$evidence/java-version.txt"
          sdk_manager="$(command -v sdkmanager || true)"
          if [ -z "$sdk_manager" ]; then
            android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            test -n "$android_sdk"
            sdk_manager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$sdk_manager"
          printf '%s\n' "$sdk_manager" > "$evidence/sdkmanager-path.txt"
          "$sdk_manager" --version | tee "$evidence/sdkmanager-version.txt"
          "$sdk_manager" --list_installed > "$evidence/android-installed.txt"
          flutter doctor -v > "$evidence/flutter-doctor.txt" 2>&1
      - name: Download fixed official Godot CLI templates and AAR
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence/godot-preparation"
          downloads="$RUNNER_TEMP/godot-downloads"
          mkdir -p "$downloads"
          cd "$downloads"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          cli="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 600 "$release/$cli" -o "$cli"
          curl --fail --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 600 "$release/$templates" -o "$templates"
          curl --fail --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 60 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $cli" SHA512-SUMS.txt > selected-checksums.txt
          grep -F " $templates" SHA512-SUMS.txt >> selected-checksums.txt
          sha512sum --check selected-checksums.txt | tee "$evidence/godot-checksums.txt"
          sha256sum "$cli" "$templates" > "$evidence/godot-observed-sha256.txt"
          cp SHA512-SUMS.txt "$evidence/"
          unzip -q "$cli" -d cli
          ./cli/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --version | tee "$evidence/godot-version.txt"
          grep -Eq '^4\.5\.1\.stable\.' "$evidence/godot-version.txt"
          unzip -l "$templates" > "$evidence/templates-list.txt"
          grep -q 'templates/android_debug.apk' "$evidence/templates-list.txt"
          grep -q 'templates/android_release.apk' "$evidence/templates-list.txt"
          maven="https://repo.maven.apache.org/maven2/org/godotengine/godot/$GODOT_MAVEN_VERSION"
          for extension in pom aar; do
            filename="godot-$GODOT_MAVEN_VERSION.$extension"
            curl --fail --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 600 "$maven/$filename" -o "$filename"
            sha256sum "$filename" >> "$evidence/godot-observed-sha256.txt"
          done
          cp "godot-$GODOT_MAVEN_VERSION.pom" "$evidence/"
          unzip -l "godot-$GODOT_MAVEN_VERSION.aar" > "$evidence/aar-list.txt"
          grep -Eq 'jni/arm64-v8a/.*\.so' "$evidence/aar-list.txt"
          unzip -p "godot-$GODOT_MAVEN_VERSION.aar" META-INF/com/android/build/gradle/aar-metadata.properties > "$evidence/aar-metadata.properties"
      - name: Resolve and compile a disposable compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence/godot-preparation"
          probe="$RUNNER_TEMP/godot_toolchain_probe"
          flutter create --no-pub --platforms=android --org=com.tivini.probe --project-name=godot_probe "$probe" 2>&1 | tee "$evidence/flutter-create.log"
          export GODOT_PROBE_DIR="$probe"
          python3 - <<'PY'
          import os
          from pathlib import Path
          gradle = Path(os.environ["GODOT_PROBE_DIR"]) / "android/app/build.gradle.kts"
          content = gradle.read_text()
          assert "minSdk = flutter.minSdkVersion" in content, "Flutter template changed: review minSdk before proceeding"
          content = content.replace("minSdk = flutter.minSdkVersion", 'minSdk = 30\n        ndk { abiFilters.clear(); abiFilters.add("arm64-v8a") }')
          content += '\n' + 'dependencies { implementation("org.godotengine:godot:' + os.environ["GODOT_MAVEN_VERSION"] + '") }\n'
          gradle.write_text(content)
          PY
          cd "$probe"
          flutter pub get 2>&1 | tee "$evidence/probe-pub-get.log"
          flutter build apk --debug --target-platform android-arm64 2>&1 | tee "$evidence/probe-build.log"
          (cd android && ./gradlew :app:dependencies --configuration debugRuntimeClasspath) > "$evidence/probe-dependencies.txt" 2>&1
          cp android/app/build.gradle.kts android/settings.gradle.kts android/gradle/wrapper/gradle-wrapper.properties "$evidence/"
          (cd android && ./gradlew --version) > "$evidence/gradle-version.txt" 2>&1
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          apk = Path("build/app/outputs/flutter-apk/app-debug.apk")
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              abis = sorted({n.split("/")[1] for n in names if n.startswith("lib/") and n.endswith(".so")})
              godot = [n for n in names if n.startswith("lib/arm64-v8a/") and "godot" in n and n.endswith(".so")]
              assert abis == ["arm64-v8a"], abis
              assert godot, "Official Godot native library missing from probe APK"
          metadata = {"source_sha": os.environ["GITHUB_SHA"], "probe_apk_sha256": hashlib.file_digest(apk.open("rb"), "sha256").hexdigest(), "abis": abis, "godot_libraries": godot, "host_implemented": False, "hardware_tested": False, "security_clearance": False}
          (Path(os.environ["GITHUB_WORKSPACE"]) / "evidence/godot-preparation/probe-result.json").write_text(json.dumps(metadata, indent=2))
          PY
      - name: Report preparation outcome
        if: always()
        env:
          PREPARATION_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Preparation status: %s\n' "$PREPARATION_STATUS"
            printf 'Source: %s\n' "$GITHUB_SHA"
            printf '%s\n' 'This is a disposable dependency probe, not a Living World APK.'
            printf '%s\n' 'Task 1 native host, security review, instrumentation and S22 tests: NOT EXECUTED.'
          } | tee evidence/godot-preparation/STATUS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-godot-preparation-${{ github.sha }}
          path: evidence/godot-preparation/
          if-no-files-found: error
          retention-days: 14
