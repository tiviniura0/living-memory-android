name: Living World Godot preparation
on:
  workflow_dispatch:
  push:
    branches: ['work/living-world-godot2d']
    paths: ['.github/workflows/world-godot.yml']
permissions:
  contents: read
concurrency:
  group: world-godot-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  task1:
    if: github.ref == 'refs/heads/work/living-world-godot2d'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Record source and bootstrap non-destructive shell
        run: |
          set -euo pipefail
          mkdir -p evidence/godot-task1
          git rev-parse HEAD > evidence/godot-task1/source-sha.txt
          python3 -m unittest discover -s tests -v 2>&1 | tee evidence/godot-task1/python.log
          bash scripts/prepare_world_android.sh
          cd apps/world_observer
          flutter pub get
          flutter test --reporter expanded 2>&1 | tee ../../evidence/godot-task1/observer-tests.log
          flutter analyze
      - name: Build native RED scaffold for emulator
        run: |
          set -euo pipefail
          cd apps/world_observer
          ORG_GRADLE_PROJECT_godotTestAbi=x86_64 flutter build apk --debug --target-platform android-x64
          cd android
          ./gradlew :app:assembleDebugAndroidTest -PgodotTestAbi=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native RED on matching x86_64 official Godot AAR
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/test_world_godot_native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-godot-task1-evidence-${{ github.sha }}
          path: |
            evidence/godot-task1/
            apps/world_observer/build/app/reports/androidTests/
            apps/world_observer/build/app/outputs/androidTest-results/
            apps/world_observer/android/
          if-no-files-found: error
          retention-days: 14
