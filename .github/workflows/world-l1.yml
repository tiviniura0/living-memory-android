name: Living World L1
on:
  push:
    branches: ['work/living-world-l1-observable']
    paths: ['packages/**', 'apps/**', 'tools/world_headless/**', 'scripts/check_world_boundaries.py', 'tests/test_world_boundaries.py', '.github/workflows/world-l1.yml']
permissions:
  contents: read
concurrency:
  group: world-l1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Pure Dart suites
        run: |
          set -euo pipefail
          mkdir -p evidence
          for package in world_contracts world_core agent_runtime world_persistence; do
            (cd packages/$package && dart pub get --enforce-lockfile && dart analyze && dart test --reporter expanded) 2>&1 | tee evidence/$package.log
          done
      - name: Flutter tests
        working-directory: apps/world_observer
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter test --reporter expanded 2>&1 | tee ../../evidence/flutter.log
          flutter analyze
      - name: Headless, boundaries and protected modules
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_world_boundaries.py -v
          python3 scripts/check_world_boundaries.py
          git diff --exit-code 376ccf33353ec101b1c424b6121eb69ecfc55f62 HEAD -- samples/litert/flutter .github/workflows/build-apk.yml
          cd tools/world_headless
          dart pub get --enforce-lockfile
          dart analyze
          dart test --reporter expanded
          dart run bin/world_headless.dart --fixture ../../fixtures/world/l1_world.json --ticks 10000 --out ../../evidence/headless.json
      - name: Prepare Android application
        run: bash scripts/prepare_world_android.sh
      - name: Build Android ARM64
        working-directory: apps/world_observer
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-release.apk
          git diff --exit-code -- pubspec.lock
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > ../../evidence/apk-signature.txt
          "$build_tools/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > ../../evidence/apk-badging.txt
          python3 ../../scripts/inspect_world_apk.py build/app/outputs/flutter-apk/app-release.apk ../../evidence/apk-badging.txt ../../evidence/apk-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-l1-apk-${{ github.sha }}
          path: apps/world_observer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-l1-evidence-${{ github.sha }}
          path: |
            evidence/
            apps/world_observer/pubspec.lock
            apps/world_observer/android/
