name: Verify frozen V1.1 APK
on:
  push:
    branches: ['work/living-memory-v1.1-apk']
    paths: ['.github/workflows/verify-v1.1-apk.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 40480260704
          name: living-memory-android-5cf1cc2e6a6b06da2d7b440143de6a0b75ca39bd
          github-token: ${{ github.token }}
          path: downloaded
      - name: Verify Android signature and manifest
        shell: bash
        run: |
          mkdir verified
          cp downloaded/evidence/* verified/
          tools_version=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools_version/apksigner" verify --verbose --print-certs downloaded/app/outputs/flutter-apk/app-release.apk | tee verified/apk-signature.txt
          "$tools_version/aapt" dump badging downloaded/app/outputs/flutter-apk/app-release.apk > verified/apk-badging.txt
      - name: Verify bytes, signer formats, ABI and embedded model
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          def certificate(text):
              matches=re.findall(r'certificate SHA-256 digest: ([a-fA-F0-9]{64})',text)
              assert len(matches)==1, 'Exactly one signing certificate expected'
              return matches[0].lower()
          previous='cc90f8b4d170d0410025bab5ba3af71567fd6ecbd420c411230043c7389dc487'
          for prefix in ('Signer #1: ', 'V2 Signer: ', 'Signer #1 '):
              assert certificate(prefix+'certificate SHA-256 digest: '+previous)==previous
          apk=Path('downloaded/app/outputs/flutter-apk/app-release.apk')
          expected=Path('verified/APK-SHA256.txt').read_text().split()[0]
          h=hashlib.sha256()
          with apk.open('rb') as f:
              for part in iter(lambda:f.read(8*1024*1024),b''): h.update(part)
          actual=h.hexdigest()
          assert actual==expected, (actual,expected)
          with zipfile.ZipFile(apk) as z:
              abis=sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')})
              assert abis==['arm64-v8a'],abis
              model_size=z.getinfo('assets/flutter_assets/assets/models/embeddinggemma-2-740m.litertlm').file_size
              assert model_size==484622336,model_size
          cert=certificate(Path('verified/apk-signature.txt').read_text())
          metadata={'apk_bytes':apk.stat().st_size,'apk_sha256':actual,'abis':abis,
                    'embedding_model_bytes':model_size,'certificate_sha256':cert,
                    'v1_certificate_matches':cert==previous,'tested_source':'89de7bd6b76c8ba8889ab1c17b4c1da8b99cf31a',
                    'build_commit':'5cf1cc2e6a6b06da2d7b440143de6a0b75ca39bd','build_run':40480260704,'test_run':40478470088}
          Path('verified/apk-metadata.json').write_text(json.dumps(metadata,indent=2))
          print(json.dumps(metadata,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: living-memory-v1.1-apk-verified
          path: verified/
          retention-days: 30
          if-no-files-found: error
